# nginx for the TorXNG stack (image nginxinc/nginx-unprivileged, uid 101).
# Mounted read-only as /etc/nginx/nginx.conf; the container root filesystem is
# read-only, only /tmp (tmpfs) is writable.
#
# Both access paths end here, so every visitor gets the same headers and
# rate limits:
#   host 127.0.0.1:8080 -> 172.30.0.3:8080 (published port, loopback only)
#   onion :80 (tor 172.30.0.2) -> 172.30.0.3:8080 (HiddenServicePort)
# and everything is proxied to core (172.30.0.10:8080), which is reachable
# only from the internal Docker network.

# One worker is plenty for a personal instance and keeps the process count
# low (worker_processes auto would start one per host CPU, not per CPU quota).
worker_processes 1;
pid /tmp/nginx.pid;
# Main-context log: startup, configuration and worker process problems.
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    # writable scratch paths on the tmpfs
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    # Privacy: no access log, so no query, IP or User-Agent is ever written.
    access_log off;
    # Request-level messages (rate limiting, upstream errors, oversized
    # requests, ...) carry the request line, i.e. the search terms of GET
    # /search?q=... and the image URLs of /image_proxy. Only "crit" and above
    # is logged while handling requests. Trade-off: failed upstream requests
    # (502/504) are visible to the client but not in the nginx log; SearXNG's
    # own log (core) still reports engine errors without the query.
    error_log /dev/stderr crit;
    # Do not advertise the nginx version (Server: nginx).
    server_tokens off;

    sendfile on;
    tcp_nodelay on;

    # --- request limits (slowloris / oversized requests) -------------------
    # SearXNG forms are tiny (query + preferences); 32k is generous.
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_header_buffer_size 1k;
    # Request line or a header above 8k -> 414 / 400 (e.g. a 10k character query).
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;

    # --- rate limits ----------------------------------------------------------
    # Keyed on the client address. Every onion visitor arrives from the tor
    # container (172.30.0.2), so for onion traffic these limits are also a
    # global cap that protects a low-end host (and the Tor exits) from floods.
    limit_req_zone $binary_remote_addr zone=search:1m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=img:1m rate=20r/s;
    limit_req_status 429;
    # below the error_log level: rejected requests are never logged
    limit_req_log_level info;

    # Result pages are highly compressible and Tor bandwidth is scarce. The
    # pages contain no secrets (no CSRF tokens, no session data), so
    # compression-oracle attacks (BREACH) have nothing to extract.
    gzip on;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/xml application/xml image/svg+xml text/plain;

    # Host header for SearXNG (used to build absolute URLs, e.g. opensearch.xml):
    # keep the port of the published address; fall back to $host if a client
    # sends no Host header.
    map $http_host $upstream_host {
        ""      $host;
        default $http_host;
    }

    upstream searxng_core {
        # static address of core on the isolated network
        server 172.30.0.10:8080;
        keepalive 4;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Only the methods SearXNG uses; everything else (PUT, DELETE,
        # OPTIONS, PATCH, ...) -> 405. TRACE is rejected by nginx itself.
        if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 405;
        }

        # --- security headers ------------------------------------------------
        # Added once here ("always" = also on 4xx/5xx), same-named headers
        # from SearXNG are hidden so none appears twice. No location below
        # uses add_header, so all of them inherit this set.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header X-Powered-By;
        # SearXNG reports its processing time (total/render); do not expose
        # backend timings (timing side channel, e.g. cache hits).
        proxy_hide_header Server-Timing;

        # SearXNG's simple theme has no inline scripts, inline styles or event
        # handler attributes, so no 'unsafe-inline' is needed. Images come
        # only from SearXNG itself (image_proxy is on and locked).
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; manifest-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # --- proxy settings (inherited by all locations) ---------------------
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $upstream_host;
        # SET (never append): a client cannot inject addresses. core trusts
        # X-Forwarded-For only from 172.30.0.3 (searxng/limiter.toml); onion
        # visitors show up as 172.30.0.2 (the tor container).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        # searches can take up to max_request_timeout (30 s) + Tor latency
        proxy_read_timeout 60s;
        # never spool responses (e.g. proxied images) to disk: /tmp is a small
        # tmpfs that counts against the container's memory limit
        proxy_max_temp_file_size 0;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;

        location = /search {
            limit_req zone=search burst=10 nodelay;
            proxy_pass http://searxng_core;
        }

        location = /autocompleter {
            limit_req zone=search burst=10 nodelay;
            proxy_pass http://searxng_core;
        }

        location = /image_proxy {
            limit_req zone=img burst=60;
            proxy_pass http://searxng_core;
        }

        location = /favicon_proxy {
            limit_req zone=img burst=60;
            proxy_pass http://searxng_core;
        }

        location / {
            proxy_pass http://searxng_core;
        }
    }
}
