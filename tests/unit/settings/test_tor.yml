# This SearXNG setup is used in unit tests which need the Tor circuits and the
# Tor control port, see SearxTorTestCase in tests/__init__.py (the check of the
# Tor proxy is patched, no request is sent to the Tor network).

use_default_settings:

  engines:
    # remove all engines
    keep_only: []

search:

  formats: [html, csv, json, rss]

server:

  secret_key: "user_secret_key"

outgoing:

  using_tor_proxy: true
  proxies:
    "all://": "socks5h://127.0.0.1:9050"
  tor_circuits: 3
  extra_proxy_timeout: 5.0
  tor_control:
    host: 127.0.0.1
    port: 9051
    password: test

engines:

  - name: dummy engine
    engine: demo_offline
    categories: ["general"]
    shortcut: "gd"
    timeout: 3
