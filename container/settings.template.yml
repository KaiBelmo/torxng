# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/
#
# Tor-only build: SearXNG refuses to start unless every outgoing request goes
# through a Tor SOCKS proxy with remote DNS (socks5h://). The container image
# sets the environment variable SEARXNG_TOR_PROXY=socks5h://tor:9050 (a Tor
# container named "tor" on the same network); it replaces outgoing.proxies.
# Point it at another Tor SocksPort with "-e SEARXNG_TOR_PROXY=socks5h://host:port".

use_default_settings: true

server:
  secret_key: "ultrasecretkey"
  image_proxy: true

outgoing:
  # The default of this build; false (no Tor) refuses to start.
  using_tor_proxy: true
